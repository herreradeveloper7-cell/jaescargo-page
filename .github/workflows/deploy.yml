name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build

      - name: Inspect hosting directories
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import ftplib, ssl, os
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=30)
          ftp.connect('srv757.hstgr.io', 21)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          for path in ['/', '/domains', '/domains/jaescargo.com', '/public_html']:
              try:
                  ftp.cwd(path)
                  print(path, ftp.nlst())
              except ftplib.error_perm as error:
                  print(path, str(error))
          ftp.quit()
          PY

      - name: Publish dist to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # Hostinger server757 hostname matches its FTPS certificate.
          server: srv757.hstgr.io
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
